[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artha"
version = "0.1.0"
description = "ARTHA — a suitability-first lending intelligence layer for Indian banking"
readme = "../README.md"
requires-python = ">=3.11"
authors = [{ name = "Team Wowwsters" }]

[tool.setuptools.packages.find]
include = ["artha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
